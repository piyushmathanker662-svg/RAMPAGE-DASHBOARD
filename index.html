<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rampage Esports</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Rampage Intro -->
    <div id="intro">
        <div class="logo-container">
            <img src="logo.png" alt="Rampage Esports Logo">
            <h1>RAMPAGE ESPORTS</h1>
        </div>
    </div>

    <!-- Login Screen -->
    <main id="login-page">
        <div class="login-box">
            <h2>RAMPAGE ESPORTS</h2>
            <p>PRIVATE MANAGEMENT PORTAL</p>

            <input type="text" id="teamId" placeholder="Team ID">
            <input type="password" id="password" placeholder="Password">

            <button onclick="login()">LOGIN</button>

            <div id="error"></div>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
